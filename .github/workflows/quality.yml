name: Quality

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_HOME: ${{ github.workspace }}/.tools/node
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PNPM_CONFIG_NPMRC_AUTH_FILE: ${{ github.workspace }}/.config/pnpm-auth-empty
      PNPM_HOME: ${{ github.workspace }}/.tools/pnpm
      TMPDIR: ${{ github.workspace }}/.tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
      XDG_DATA_HOME: ${{ github.workspace }}/.local/share
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install and run quality gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NODE_HOME" "$PLAYWRIGHT_BROWSERS_PATH" "$PNPM_HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          : > "$PNPM_CONFIG_NPMRC_AUTH_FILE"
          node_version="$(tr -d '\r\n' < .node-version)"
          if [[ "$node_version" != "24.19.0" ]]; then
            echo "Node.js version and workflow integrity baseline are out of sync." >&2
            exit 1
          fi
          node_tarball="$TMPDIR/node-v${node_version}-linux-x64.tar.xz"
          curl --fail --location --silent --show-error "https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-x64.tar.xz" --output "$node_tarball"
          node_checksum="$(openssl dgst -sha256 "$node_tarball" | awk '{print $NF}')"
          if [[ "$node_checksum" != "14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647" ]]; then
            echo "Node.js tarball integrity verification failed." >&2
            exit 1
          fi
          tar --extract --xz --file "$node_tarball" --directory "$NODE_HOME" --strip-components=1
          export PATH="$NODE_HOME/bin:$PATH"
          pnpm_tarball="$TMPDIR/pnpm-11.22.0.tgz"
          curl --fail --location --silent --show-error "https://registry.npmjs.org/pnpm/-/pnpm-11.22.0.tgz" --output "$pnpm_tarball"
          pnpm_integrity="$(openssl dgst -sha512 -binary "$pnpm_tarball" | openssl base64 -A)"
          if [[ "$pnpm_integrity" != "H/hwxMYTPf2I+yr8Rt0T1H8JyXlLQ4xv20fKmMrzvBY4HuC+k6CRuOOCTPAfiJ9G19niCRD7C+GrD7W6qA3WIQ==" ]]; then
            echo "pnpm tarball integrity verification failed." >&2
            exit 1
          fi
          tar --extract --gzip --file "$pnpm_tarball" --directory "$PNPM_HOME" --strip-components=1
          pnpm_cli="$PNPM_HOME/bin/pnpm.cjs"
          ln -s pnpm.mjs "$PNPM_HOME/bin/pnpm"
          export PATH="$PNPM_HOME/bin:$PATH"
          node "$pnpm_cli" --version
          node "$pnpm_cli" install --frozen-lockfile
          node "$pnpm_cli" exec playwright install --with-deps chromium
          node "$pnpm_cli" check
